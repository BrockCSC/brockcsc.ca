name: Compute deployment context
description: Derive image tag, environment, project name, subdomain and DB schema from the triggering ref/branch

inputs:
  branch:
    description: Bare branch name to use instead of GITHUB_REF (branch-delete cleanup only)
    required: false
    default: ""

outputs:
  image_tag:
    value: ${{ steps.run.outputs.image_tag }}
  env_name:
    value: ${{ steps.run.outputs.env_name }}
  project_name:
    value: ${{ steps.run.outputs.project_name }}
  subdomain:
    value: ${{ steps.run.outputs.subdomain }}
  db_schema:
    value: ${{ steps.run.outputs.db_schema }}
  git_branch:
    value: ${{ steps.run.outputs.git_branch }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: .github/scripts/package-lock.json

    - shell: bash
      working-directory: .github/scripts
      run: npm ci

    - id: run
      shell: bash
      working-directory: .github/scripts
      env:
        BRANCH_OVERRIDE: ${{ inputs.branch }}
      run: npx tsx src/compute-context.ts
