name: Cleanup preview deployments

on:
  delete:
  schedule:
    # Daily at 09:00 UTC - sweeps any preview stack that's stale or whose
    # branch is gone (belt-and-suspenders alongside the `delete` trigger).
    - cron: "0 9 * * *"

jobs:
  on-branch-delete:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ctx
        uses: ./.github/actions/compute-context
        with:
          branch: ${{ github.event.ref }}

      - name: Delete Komodo stack
        working-directory: .github/scripts
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          PROJECT_NAME: ${{ steps.ctx.outputs.project_name }}
        run: npx tsx src/komodo-delete.ts

      - name: Drop preview schema
        working-directory: .github/scripts
        env:
          SSH_KEY: ${{ secrets.BROCKCSC_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.BROCKCSC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BROCKCSC_DEPLOY_USER }}
          DB_SCHEMA: ${{ steps.ctx.outputs.db_schema }}
        run: npx tsx src/drop-preview-schema.ts

  stale-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - working-directory: .github/scripts
        run: npm ci

      - name: Sweep stale preview deployments
        working-directory: .github/scripts
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BROCKCSC_DEPLOY_SSH_KEY: ${{ secrets.BROCKCSC_DEPLOY_SSH_KEY }}
          BROCKCSC_DEPLOY_HOST: ${{ vars.BROCKCSC_DEPLOY_HOST }}
          BROCKCSC_DEPLOY_USER: ${{ vars.BROCKCSC_DEPLOY_USER }}
        run: npx tsx src/cleanup-stale.ts
