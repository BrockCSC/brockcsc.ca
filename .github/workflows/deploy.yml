name: Deploy

on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.ctx.outputs.image_tag }}
      env_name: ${{ steps.ctx.outputs.env_name }}
      project_name: ${{ steps.ctx.outputs.project_name }}
      subdomain: ${{ steps.ctx.outputs.subdomain }}
      db_schema: ${{ steps.ctx.outputs.db_schema }}
      git_branch: ${{ steps.ctx.outputs.git_branch }}
    steps:
      - uses: actions/checkout@v4
      - id: ctx
        uses: ./.github/actions/compute-context

  checks:
    needs: context
    uses: ./.github/workflows/checks.yml

  build:
    needs: [context, checks]
    # The VPS is ARM64 (Oracle Ampere) - build natively on an ARM64 runner
    # rather than cross-building with QEMU from amd64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://${{ needs.context.outputs.subdomain }}
          tags: ghcr.io/brockcsc/brockcsc-ca-web:${{ needs.context.outputs.image_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build + push api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/brockcsc/brockcsc-ca-api:${{ needs.context.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Make packages public (first push only, best-effort)
        continue-on-error: true
        run: |
          gh api --method PATCH /orgs/BrockCSC/packages/container/brockcsc-ca-web -f visibility=public || true
          gh api --method PATCH /orgs/BrockCSC/packages/container/brockcsc-ca-api -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [context, build]
    runs-on: ubuntu-latest
    # Only prod is gated behind the required-reviewer protection rule
    # configured on the "production" GitHub Environment; dev/preview resolve
    # to their own (unprotected, auto-created) environment names.
    environment: ${{ needs.context.outputs.env_name == 'prod' && 'production' || needs.context.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-stack
        with:
          project_name: ${{ needs.context.outputs.project_name }}
          image_tag: ${{ needs.context.outputs.image_tag }}
          subdomain: ${{ needs.context.outputs.subdomain }}
          git_branch: ${{ needs.context.outputs.git_branch }}
          db_schema: ${{ needs.context.outputs.db_schema }}
          env_name: ${{ needs.context.outputs.env_name }}
          komodo_host: ${{ vars.KOMODO_HOST }}
          komodo_api_key: ${{ secrets.KOMODO_API_KEY }}
          komodo_api_secret: ${{ secrets.KOMODO_API_SECRET }}
          db_password: ${{ secrets.BROCKCSC_DB_PASSWORD }}
          keycloak_issuer: ${{ vars.BROCKCSC_KEYCLOAK_ISSUER }}
          keycloak_client_id: ${{ vars.BROCKCSC_KEYCLOAK_CLIENT_ID }}
          keycloak_client_secret: ${{ secrets.BROCKCSC_KEYCLOAK_CLIENT_SECRET }}
          session_jwt_secret: ${{ secrets.BROCKCSC_SESSION_JWT_SECRET }}
