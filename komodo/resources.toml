[[resource_sync]]
name = "brockcsc-website"
description = "Syncs komodo/resources.toml from BrockCSC/website."
[resource_sync.config]
git_provider = "github.com"
repo = "BrockCSC/website"
branch = "main"
resource_path = ["komodo/resources.toml"]
webhook_enabled = true

