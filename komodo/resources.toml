##

[[action]]
name = "brockcsc-deploy"
description = "Builds + deploys brockcsc.ca for a given ref. Triggered by .github/workflows/ci.yml after the GitHub Environment review gate approves."
tags = ["brockcsc"]
[action.config]
webhook_enabled = false
arguments_format = "key_value"
arguments = """
REF=refs/heads/main
SHA=
"""
file_contents = '''
// Kept in sync by hand with komodo/actions/deploy.ts in the repo - see that
// file for the commented explanation of what this does.

const VPS_HOST = "129-153-49-190.sslip.io";
const REPO = "BrockCSC/website";
const SERVER = "wayfarerbx-vps";

const slugify = (branch: string): string =>
  branch
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40);

const schemaSlug = (slug: string): string => slug.replace(/-/g, "_");

const ref = ARGS.REF;
const sha = ARGS.SHA ?? "";

let envName: "prod" | "uat" | "dev";
let projectName: string;
let subdomain: string;
let dbSchema: string;
let branch: string;

if (ref.startsWith("refs/tags/")) {
  branch = ref.slice("refs/tags/".length);
  envName = "prod";
  projectName = "brockcsc-prod";
  subdomain = `brockcsc.${VPS_HOST}`;
  dbSchema = "prod";
} else if (ref === "refs/heads/main") {
  branch = "main";
  envName = "uat";
  projectName = "brockcsc-uat";
  subdomain = `uat.${VPS_HOST}`;
  dbSchema = "uat";
} else {
  branch = ref.replace(/^refs\/heads\//, "");
  const slug = slugify(branch);
  envName = "dev";
  projectName = `brockcsc-pr-${slug}`;
  subdomain = `${slug}.${VPS_HOST}`;
  dbSchema = `preview_${schemaSlug(slug)}`;
}

console.log(
  `Deploying ${projectName} (${envName}) from ${branch} -> https://${subdomain}`,
);

await komodo.write("UpdateBuild", {
  id: "brockcsc",
  config: { branch },
});

const buildUpdate = await komodo.execute("RunBuild", { build: "brockcsc" });
if (!buildUpdate.success) {
  throw new Error(`Build failed for ${branch} - see Build logs in Komodo.`);
}

const imageTag = buildUpdate.commit_hash || sha || "latest";

const databaseUrl = `postgresql://brockcsc:[[BROCKCSC_DB_PASSWORD]]@postgres:5432/brockcsc`;
const environment = [
  `IMAGE_TAG=${imageTag}`,
  `PROJECT_NAME=${projectName}`,
  `SUBDOMAIN=${subdomain}`,
  `DATABASE_URL=${databaseUrl}`,
  `DB_SCHEMA=${dbSchema}`,
  `KEYCLOAK_ISSUER=[[BROCKCSC_KEYCLOAK_ISSUER]]`,
  `KEYCLOAK_CLIENT_ID=[[BROCKCSC_KEYCLOAK_CLIENT_ID]]`,
  `KEYCLOAK_CLIENT_SECRET=[[BROCKCSC_KEYCLOAK_CLIENT_SECRET]]`,
  `ADMIN_ROLE=brockcsc-admin`,
  `SESSION_JWT_SECRET=[[BROCKCSC_SESSION_JWT_SECRET]]`,
].join("\n");

const config = {
  server: SERVER,
  repo: REPO,
  branch,
  git_provider: "github.com",
  file_paths: ["deploy/docker-compose.yml"],
  auto_pull: false,
  destroy_before_deploy: false,
  webhook_enabled: false,
  environment,
};

let exists = true;
try {
  await komodo.read("GetStack", { stack: projectName });
} catch {
  exists = false;
}

if (exists) {
  await komodo.write("UpdateStack", { id: projectName, config });
} else {
  await komodo.write("CreateStack", { name: projectName, config });
}

const deployUpdate = await komodo.execute("DeployStack", {
  stack: projectName,
});
if (!deployUpdate.success) {
  throw new Error(
    `Deploy failed for ${projectName} - see Stack logs in Komodo.`,
  );
}

console.log(`Deployed ${projectName} -> https://${subdomain}`);
'''

##

[[action]]
name = "brockcsc-preview-sweep"
description = "Deletes brockcsc-pr-* preview stacks whose branch is gone or stale, and drops their preview_* schema."
tags = ["brockcsc"]
[action.config]
webhook_enabled = false
schedule = "at 09:00 am"
schedule_format = "English"
schedule_enabled = true
file_contents = '''
// Kept in sync by hand with komodo/actions/preview-sweep.ts in the repo -
// see that file for the commented explanation of what this does.

import { Client } from "npm:pg@8";

const STALE_MS = 3 * 24 * 60 * 60 * 1000;
const REPO = "BrockCSC/website";

const slugify = (branch: string): string =>
  branch
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40);

const schemaSlug = (slug: string): string => slug.replace(/-/g, "_");

const ghFetch = async (path: string) => {
  const res = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
    headers: {
      Authorization: `Bearer [[GITHUB_TOKEN]]`,
      Accept: "application/vnd.github+json",
    },
  });
  if (!res.ok) {
    throw new Error(`GitHub API ${path} failed: ${res.status}`);
  }
  return res.json();
};

const branches = (await ghFetch("/branches?per_page=100")) as {
  name: string;
}[];
const slugToBranch = new Map<string, string>();
for (const branch of branches) slugToBranch.set(slugify(branch.name), branch.name);

const stacks = (await komodo.read("ListStacks", {})) as { name: string }[];
const now = Date.now();

const client = new Client({
  connectionString: `postgresql://brockcsc:[[BROCKCSC_DB_PASSWORD]]@postgres:5432/brockcsc`,
});
await client.connect();

try {
  for (const stack of stacks) {
    if (!stack.name.startsWith("brockcsc-pr-")) continue;

    const slug = stack.name.slice("brockcsc-pr-".length);
    const branch = slugToBranch.get(slug);

    let stale = false;
    if (!branch) {
      console.log(`${stack.name}: source branch no longer exists`);
      stale = true;
    } else {
      const commit = (await ghFetch(
        `/commits/${encodeURIComponent(branch)}`,
      )) as { commit: { committer?: { date: string }; author?: { date: string } } };
      const commitDate = commit.commit.committer?.date ?? commit.commit.author?.date;
      const ageMs = now - new Date(commitDate ?? 0).getTime();
      if (ageMs > STALE_MS) {
        console.log(
          `${stack.name}: branch '${branch}' last active ${Math.floor(ageMs / 86_400_000)} days ago, stale`,
        );
        stale = true;
      }
    }

    if (!stale) continue;

    await komodo.write("DeleteStack", { id: stack.name });

    const schema = `preview_${schemaSlug(slug)}`;
    await client.query(`DROP SCHEMA IF EXISTS "${schema}" CASCADE`);
    console.log(`Deleted ${stack.name} and dropped schema "${schema}"`);
  }
} finally {
  await client.end();
}
'''

