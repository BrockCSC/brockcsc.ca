# Declarative Komodo config, synced by a ResourceSync pointed at this repo.
# Field reference: https://komo.do/docs/automate/sync-resources
#
# What's NOT declared here, on purpose:
# - Server "wayfarerbx-vps" and Builder "wayfarerbx-vps" - pre-existing
#   platform resources shared with other wayfarerbx services, not owned by
#   this repo.
# - brockcsc-pr-* preview stacks - created/destroyed dynamically per branch
#   by komodo/actions/deploy.ts and komodo/actions/preview-sweep.ts, since
#   their names depend on the branch slug.
#
# Secrets referenced via [[VAR_NAME]] below must be created as Komodo
# Variables (Settings -> Variables) before the first sync - see README.md.

[[build]]
name = "brockcsc"
description = "Builds the brockcsc.ca web app image and pushes it to ghcr.io."
tags = ["brockcsc"]
[build.config]
builder = "wayfarerbx-vps"
git_provider = "github.com"
repo = "BrockCSC/website"
branch = "main"
build_path = "."
dockerfile_path = "Dockerfile"
image_name = "brockcsc-ca"
include_commit_tag = true
include_latest_tag = false
include_version_tags = false
webhook_enabled = false
image_registry.type = "Standard"
[build.config.image_registry.params]
domain = "ghcr.io"
account = "brockcsc"
organization = "BrockCSC"

##

[[stack]]
name = "brockcsc-uat"
description = "uat.129-153-49-190.sslip.io - deploys from main."
tags = ["brockcsc"]
[stack.config]
server = "wayfarerbx-vps"
git_provider = "github.com"
repo = "BrockCSC/website"
branch = "main"
file_paths = ["deploy/docker-compose.yml"]
auto_pull = false
destroy_before_deploy = false
webhook_enabled = false
environment = """
IMAGE_TAG=latest
PROJECT_NAME=brockcsc-uat
SUBDOMAIN=uat.129-153-49-190.sslip.io
DB_SCHEMA=uat
ADMIN_ROLE=brockcsc-admin
DATABASE_URL=postgresql://brockcsc:[[BROCKCSC_DB_PASSWORD]]@postgres:5432/brockcsc
KEYCLOAK_ISSUER=[[BROCKCSC_KEYCLOAK_ISSUER]]
KEYCLOAK_CLIENT_ID=[[BROCKCSC_KEYCLOAK_CLIENT_ID]]
KEYCLOAK_CLIENT_SECRET=[[BROCKCSC_KEYCLOAK_CLIENT_SECRET]]
SESSION_JWT_SECRET=[[BROCKCSC_SESSION_JWT_SECRET]]
"""
# IMAGE_TAG is set per-deploy by komodo/actions/deploy.ts (UpdateStack),
# since it changes on every push - the value here is just a safe fallback.

